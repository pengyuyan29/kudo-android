name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      apk_name: ${{ steps.version.outputs.apk_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and calculate version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_version.py "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Signing configuration must not be persisted in a shared cache.
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify decision notes
        run: npm run verify-notes

      - name: Unit tests and Android Lint
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache --console=plain

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_release.py restore --output "$RUNNER_TEMP/kudo-signing/release.p12"

      - name: Build signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/kudo-signing/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: >-
          bash ./gradlew :app:assembleRelease
          "-PversionName=$VERSION_NAME" "-PversionCode=$VERSION_CODE"
          --no-daemon --no-configuration-cache --no-build-cache --console=plain

      - name: Verify signature and APK version, then create checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/kudo-signing/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: >-
          python3 scripts/prepare_release.py package
          --apk app/build/outputs/apk/release/app-release.apk
          --tag "$RELEASE_TAG"
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --output-dir "$RUNNER_TEMP/kudo-release-dist"

      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/kudo-signing/release.p12"

      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/kudo-release-dist/*.apk
            ${{ runner.temp }}/kudo-release-dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub Release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          sha256sum --check --strict "$APK_NAME.sha256"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != "true" ]]; then
              echo "This tag already has a published release. Use a new version tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Kudo $VERSION_NAME" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
